# nanoid 3.3.17 — 1 advisory, and this entry is bookkeeping, not a decision
#
# Reached only through postcss <- vite, i.e. build tooling. Confirmed absent
# from the deployed artefact: the Worker bundle produced by `wrangler deploy
# --dry-run` contains neither the package name nor its implementation markers
# (`urlAlphabet`, `useandom`).
#
# The fix is a version bump and it is Renovate's to make — the entry exists so
# that "OSV is red" keeps meaning "something NEW appeared" while that happens,
# rather than going red permanently and training everyone to skim past it. The
# date is deliberately short: if Renovate has not landed it by then, that is
# itself the thing worth being told about.
# ---------------------------------------------------------------------------

