# Known vulnerabilities that have been looked at, and why CI is not red for them.
#
# ## READ THIS BEFORE ADDING AN ENTRY
#
# This file exists so the scanner can be a *blocking* check. A scanner that
# reports the same findings on every run is a scanner nobody reads, and the next
# one — the new one, the one that matters — arrives into a job that has been
# failing for months and gets skimmed past. Enumerating today's findings by id is
# what makes "OSV is red" mean "something changed".
#
# So: never ignore a *package*, only individual advisory ids. A package-level
# override would also hide every future advisory for that package, which is
# precisely the finding this arrangement is built to surface.
#
# Every entry carries `ignoreUntil`. An acceptance made once and never revisited
# is indistinguishable from an acceptance nobody remembers making; the date
# forces the question again. When one expires, the answer is either "upgrade" or
# "re-read the advisory and re-date it" — not "extend the date".
#
# ## Most of this file is temporary, and should be deleted rather than renewed
#
# The Python groups below describe `poster-renderer/requirements.txt` as it
# stands on main. The V1 completion branch already moves Pillow to 12.3.0 and
# pytest to 9.1.1, and `osv-scanner scan source -L poster-renderer/requirements.txt`
# against that branch reports nothing at all. So those two groups are not a risk
# acceptance with a long life ahead of it: they keep the check usable on main
# until that branch lands, and the correct action when it does is to delete them
# and confirm the scan is still green without them.
#
# What survives the merge is the npm group — six advisories in devDependencies
# reached through drizzle-kit and miniflare, neither of which is in the deployed
# Worker. Those wait for Renovate.
#
# Consumed by .github/workflows/security.yml via `--config osv-scanner.toml`.

# ---------------------------------------------------------------------------
# esbuild 0.18.20 — 1 advisory
#
# esbuild 0.18.20 is reached only through drizzle-kit ->
# @esbuild-kit/esm-loader -> @esbuild-kit/core-utils, a devDependency used
# to generate migrations. GHSA-67mh-4wv8-2f99 is exploitable against
# `esbuild --serve`; nothing in this repository starts an esbuild dev
# server, and esbuild is not in the deployed Worker bundle.
# ---------------------------------------------------------------------------

[[IgnoredVulns]]
