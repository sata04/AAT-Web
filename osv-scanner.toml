# ---------------------------------------------------------------------------
# pillow 11.3.0 — 36 advisories
#
# Pillow is pinned because it encodes the poster PNG, so its version is part
# of the visual contract (docs/poster-renderer.md). The renderer only ever
# ENCODES: it draws a Matplotlib figure from a Zod-validated JSON plot spec
# and writes a PNG. It never opens, decodes or parses an image, has no
# network (enableInternet: false in production, --network none in CI), and
# runs as an unprivileged user in a container whose only writable path is
# the Matplotlib cache. The remediation is Pillow 12.x, which moves rendered
# bytes and therefore needs the visual review in poster-renderer/README.md
# plus a regenerated reference image.
# ---------------------------------------------------------------------------

[[IgnoredVulns]]
id = "GHSA-45hq-cxwh-f6vc"
ignoreUntil = 2026-10-12
reason = "pillow: encode-only use; fixed by the Pillow 12.3.0 bump on the V1 branch."

