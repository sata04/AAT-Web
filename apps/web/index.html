<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AAT — Acceleration Analysis Tool</title>
    <meta name="description" content="微小重力実験の加速度データを解析します。" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!--
      Two theme-color entries so the browser chrome follows the page rather than
      contradicting it. `system` resolves in JavaScript, but the first paint has
      to be right before that runs.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D1117" />
    <script>
      /*
       * Apply the stored theme before the first paint.
       *
       * Without this the app renders light, then corrects itself once React
       * mounts — a white flash into a dark instrument panel, which is exactly
       * what a tool used in a darkened control room should not do. Kept tiny and
       * inline for that reason; it is the only script in the document head.
       */
      ;(() => {
        let theme = 'light'
        try {
          const raw = localStorage.getItem('aat.analysis-config.v1')
          const setting = raw ? JSON.parse(raw).theme : 'system'
          if (setting === 'light' || setting === 'dark') {
            theme = setting
          } else {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
        } catch {
          // Unreadable storage is not a reason to fail to paint; light is the
          // documented default.
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      AATの解析はブラウザ内で実行されます。JavaScriptを有効にしてください。
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
