name: Deploy

# Design note — what this workflow is defending against
#
# The threat model is "the repository itself is hostile": a compromised
# dependency, or a commit nobody read carefully enough. The mitigation is that
# repository code and production credentials never occupy the same job.
#
# - `verify` runs everything that executes repository code — install scripts,
#   linters, tests, the frontend build, the container build — and holds no
#   Cloudflare token, no Doppler access and no OIDC capability.
# - `deploy` holds the credentials and runs almost nothing: it downloads the
#   artefacts `verify` already produced, pushes an image that was already built
#   and tested, applies reviewed migrations, and calls `wrangler deploy`.
#   It does NOT run `pnpm build`, does NOT run `docker build`, and does NOT run
#   the test suite.
#
# Why the split has to be this strict: `id-token: write` can only be granted per
# job, and GitHub injects the OIDC request variables into *every step* of that
# job (they cannot be unset per step). Any code running in `deploy` can mint an
# OIDC token and read the whole Doppler production config. There is no way to
# fence that off, so the response is to minimise what runs there at all.
#
# Residual risk that is accepted: `wrangler` itself runs in `deploy` and does
# have that reach. It is already trusted with the Cloudflare token and the
# Worker secrets, so the marginal exposure is small — and `renovate.json5` holds
# it (and the pinned actions) to a 30-day release age for exactly this reason.

# Manual-only until the production infrastructure exists.
#
# The Cloudflare account, D1 and R2 bindings, the Doppler `aat-web/prd` config
# and the `production` environment secret DOPPLER_IDENTITY_ID have not been
# provisioned yet, so an automatic push trigger would fail on every commit to
# main — training everyone to ignore a red Deploy badge, which is exactly how a
# genuine deployment failure gets missed later.
#
# The fail-closed secret check below means nothing is ever deployed half
# configured; this trigger change only stops the pointless attempt.
#
# Restore the automatic trigger once the infrastructure is in place, by adding:
#   push:
#     branches: ["main"]
# See docs/deployment.md.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and build (no credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Install pinned Python dependencies
        run: |
          python3 -m pip install --require-hashes -r reference/python/requirements.txt
          python3 -m pip install --require-hashes -r poster-renderer/requirements.txt

      - name: Golden fixtures are current
        env:
          AAT_LOG_LEVEL: ERROR
        run: python3 reference/python/generate_golden.py --check

      - name: Poster renderer visual regression
        run: python3 -m pytest poster-renderer/tests -q

      # The production client bundle is built HERE, not in the deploy job, so
      # vite/tailwind/workbox/tsc and their transitive dependencies never run
      # alongside credentials.
      - name: Build
        run: pnpm build

      # The container image is likewise built and tested here, then handed over
      # as an artefact. The deploy job pushes it without ever reading the
      # Dockerfile — this is the point of the whole split, and the reason
      # wrangler's convenience "build my Dockerfile during deploy" path is
      # deliberately not used.
      - name: Build poster renderer image
        run: docker build -t aat-poster-renderer:${{ github.sha }} poster-renderer

      - name: Test image
        run: docker run --rm --network none aat-poster-renderer:${{ github.sha }} python -m pytest /app/tests -q

      - name: Export image
        run: docker save aat-poster-renderer:${{ github.sha }} | gzip > "$RUNNER_TEMP/poster-renderer.tar.gz"

      - name: Upload client bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-client
          path: apps/web/dist/client
          retention-days: 1
          if-no-files-found: error

      - name: Upload renderer image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: poster-renderer-image
          path: ${{ runner.temp }}/poster-renderer.tar.gz
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy (credentials, no repository build)
    needs: verify
    # A workflow_dispatch from a non-main branch must not reach the secrets.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # Mint the short-lived GitHub OIDC token that authenticates to Doppler.
      # Scoped to this job; it grants no additional repository write access.
      id-token: write
    environment: production
    steps:
      - name: Check Doppler identity configuration
        env:
          DOPPLER_IDENTITY_ID: ${{ secrets.DOPPLER_IDENTITY_ID }}
        run: |
          if [ -z "$DOPPLER_IDENTITY_ID" ]; then
            echo "::error::GitHub Environment 'production' secret DOPPLER_IDENTITY_ID is unset. See docs/deployment.md."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # Needed to run wrangler. Only the allowBuilds-approved install scripts
      # execute, so the third-party code running here is wrangler, its
      # dependencies, those few scripts, and the SHA-pinned actions.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download client bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-client
          path: apps/web/dist/client

      - name: Download renderer image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: poster-renderer-image
          path: ${{ runner.temp }}

      # Short-lived credentials only: GitHub's OIDC token is exchanged for
      # Doppler access, so no long-lived Doppler service token lives in GitHub.
      # Authorisation is constrained on the Doppler side by claim rules
      # (aud / sub / ref / job_workflow_ref) so only this job, on main, qualifies.
      - name: Fetch secrets from Doppler
        id: doppler
        uses: DopplerHQ/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ secrets.DOPPLER_IDENTITY_ID }}
          doppler-project: aat-web
          doppler-config: prd

      # Fail closed rather than deploying something subtly broken. Without
      # AAT_PAGES_PROJECT there is nothing to deploy the client to; without
      # BETTER_AUTH_SECRET / AAT_RP_ID passkeys cannot be verified, and an RP ID
      # mismatch would invalidate every credential users have registered.
      #
      # CLOUDFLARE_ZONE_ID is deliberately absent. The public origin is the Pages
      # project's own hostname, which is not in a zone this account controls —
      # so there is no zone to name, and, as docs/security-scanning.md records,
      # no zone-scoped WAF or rate limiting either.
      - name: Validate required secrets
        env:
          CF_DEPLOY_TOKEN_VALUE: ${{ steps.doppler.outputs.CF_DEPLOY_TOKEN_VALUE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_HOSTNAME: ${{ steps.doppler.outputs.DEPLOY_HOSTNAME }}
          AAT_PAGES_PROJECT: ${{ steps.doppler.outputs.AAT_PAGES_PROJECT }}
          BETTER_AUTH_SECRET: ${{ steps.doppler.outputs.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ steps.doppler.outputs.BETTER_AUTH_URL }}
          AAT_RP_ID: ${{ steps.doppler.outputs.AAT_RP_ID }}
          AAT_TRUSTED_ORIGINS: ${{ steps.doppler.outputs.AAT_TRUSTED_ORIGINS }}
          AAT_D1_DATABASE_ID: ${{ steps.doppler.outputs.AAT_D1_DATABASE_ID }}
        run: |
          missing=""
          for key in CF_DEPLOY_TOKEN_VALUE CLOUDFLARE_ACCOUNT_ID DEPLOY_HOSTNAME AAT_PAGES_PROJECT \
                     BETTER_AUTH_SECRET BETTER_AUTH_URL AAT_RP_ID AAT_TRUSTED_ORIGINS \
                     AAT_D1_DATABASE_ID; do
            if [ -z "${!key}" ]; then missing="$missing $key"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Doppler (prd) is missing required secrets:$missing"
            exit 1
          fi
          echo "All required secrets are present"

      # Push the ALREADY-BUILT image to Cloudflare's registry and deploy by
      # digest. Nothing here reads poster-renderer/Dockerfile.
      - name: Push prebuilt renderer image
        id: image
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CF_DEPLOY_TOKEN_VALUE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          gunzip -c "$RUNNER_TEMP/poster-renderer.tar.gz" | docker load
          pnpm --filter @aat/web exec wrangler containers push \
            "aat-poster-renderer:${{ github.sha }}" | tee "$RUNNER_TEMP/push.log"
          # Compose the immutable reference from the two lines wrangler actually
          # prints. It does NOT print a `path@sha256:...` form anywhere — the
          # digest arrives in docker's push line and the registry path in
          # wrangler's own, so the reference has to be assembled:
          #
          #   <tag>: digest: sha256:<64 hex> size: <n>
          #   Pushed image: registry.cloudflare.com/<account>/<name>:<tag>
          #
          # Deploying by tag instead would defeat the point: a tag can be moved,
          # and the whole reason the image is built in the credential-free job is
          # so that what deploys is what was tested.
          digest=$(grep -oE 'digest: sha256:[0-9a-f]{64}' "$RUNNER_TEMP/push.log" | tail -1 | sed 's/^digest: //')
          image=$(grep -oE 'Pushed image: [^[:space:]]+' "$RUNNER_TEMP/push.log" | tail -1 | sed 's/^Pushed image: //')
          # Drop the :tag from the end, keeping any : that belongs to a port.
          repository=${image%:*}
          if [ -z "$digest" ] || [ -z "$image" ] || [ "$repository" = "$image" ]; then
            echo "::error::Could not determine the pushed image digest. Expected a 'digest: sha256:...' line and a 'Pushed image: ...' line."
            echo "::error::digest='$digest' image='$image'"
            exit 1
          fi
          ref="${repository}@${digest}"
          # The account id is a Doppler secret and therefore masked in the log;
          # print only the shape so a malformed reference is still diagnosable.
          echo "Deploying by digest (${digest})"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # The committed wrangler.jsonc carries deliberately invalid placeholders for the two
      # account-scoped values it cannot hold — the D1 database id and the container image, whose
      # registry path embeds the account id and whose digest is only known once the push above
      # finishes. Wrangler does no variable substitution inside its own configuration file, so the
      # deploy-time copy is generated here from Doppler. Everything after this step uses --config;
      # the committed file stays invalid on purpose, so a mistaken deploy from a developer machine
      # fails rather than writing into somebody else's account.
      - name: Resolve deploy configuration
        id: wrangler_config
        working-directory: apps/web
        env:
          AAT_D1_DATABASE_ID: ${{ steps.doppler.outputs.AAT_D1_DATABASE_ID }}
          POSTER_RENDERER_IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          # Beside the committed file, NOT in RUNNER_TEMP.
          #
          # Every relative path inside a wrangler configuration resolves against
          # the directory the configuration lives in — `main: worker/index.ts`,
          # `migrations_dir: migrations`, and so on. Writing the resolved copy to
          # a temporary directory therefore pointed all of them at that directory
          # instead, and the deploy failed with "No migrations present at
          # /home/runner/work/_temp/migrations" — which was the truth, stated
          # confusingly. `main` would have failed next.
          #
          # The file is gitignored; the committed one stays invalid on purpose.
          node scripts/resolve-wrangler-config.mjs wrangler.deploy.jsonc
          echo "path=wrangler.deploy.jsonc" >> "$GITHUB_OUTPUT"

      # Migrations are reviewed SQL from the repository, applied before the code
      # that depends on them. Schema changes follow expand/migrate/contract so
      # this ordering is safe.
      - name: Apply D1 migrations
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CF_DEPLOY_TOKEN_VALUE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler d1 migrations apply aat-db --remote \
            --config "${{ steps.wrangler_config.outputs.path }}"

      # Allowlist, not passthrough: only these keys reach the Worker, so the
      # deployment credentials themselves can never end up as Worker secrets.
      # --secrets-file ships code and secrets in one deploy, avoiding an
      # intermediate state where the new code runs without its configuration.
      - name: Deploy Worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CF_DEPLOY_TOKEN_VALUE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
          POSTER_RENDERER_IMAGE: ${{ steps.image.outputs.ref }}
          BETTER_AUTH_SECRET: ${{ steps.doppler.outputs.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ steps.doppler.outputs.BETTER_AUTH_URL }}
          AAT_RP_ID: ${{ steps.doppler.outputs.AAT_RP_ID }}
          AAT_RP_NAME: ${{ steps.doppler.outputs.AAT_RP_NAME }}
          AAT_TRUSTED_ORIGINS: ${{ steps.doppler.outputs.AAT_TRUSTED_ORIGINS }}
        run: |
          jq -n 'env | {
            BETTER_AUTH_SECRET,
            BETTER_AUTH_URL,
            AAT_RP_ID,
            AAT_RP_NAME,
            AAT_TRUSTED_ORIGINS
          } | with_entries(select(.value != null and .value != ""))' \
            > "$RUNNER_TEMP/worker-secrets.json"
          pnpm exec wrangler deploy --secrets-file "$RUNNER_TEMP/worker-secrets.json" \
            --config "${{ steps.wrangler_config.outputs.path }}"
          rm -f "$RUNNER_TEMP/worker-secrets.json"

      # ---------------------------------------------------------------------
      # The public origin. Deployed SECOND, on purpose.
      #
      # The Pages Function holds a Service binding to the Worker above, and a
      # binding to a Worker that does not yet exist is at best a failed deploy
      # and at worst a live front door onto nothing. Worker first, Pages second,
      # on every release, so the callee is always in place before the caller
      # references it.
      #
      # The old "Ensure custom domain" step is gone. It PUT `service: "aat-web"`
      # to the Workers Domains API, and the Worker is now `aat-api` — the call
      # would have failed *after* the migrations had already been applied, which
      # is the worst place in this workflow to fail. Worse, "fixing" it by
      # renaming the service would have given the private Worker a public custom
      # domain: a second WebAuthn origin and an unauthenticated-looking path to
      # D1 and R2, defeating `workers_dev: false` entirely. A Pages project needs
      # no domain step at all.
      # ---------------------------------------------------------------------

      # `wrangler pages deploy` has no --config flag; it reads wrangler.jsonc
      # from the working directory. apps/web/wrangler.jsonc is the Worker's — it
      # has `main` and no `pages_build_output_dir`, so Pages would warn, ignore
      # it, and deploy WITHOUT the service binding, making env.AAT_API undefined
      # and failing every /api/* request on a green deploy. Hence a directory of
      # its own, and a generated configuration inside it.
      #
      # Generated rather than committed because a Pages project's hostname is
      # mechanically its project name, and this repository does not carry its own
      # deployment's hostname.
      - name: Resolve Pages configuration
        working-directory: apps/web
        env:
          AAT_PAGES_PROJECT: ${{ steps.doppler.outputs.AAT_PAGES_PROJECT }}
        run: node scripts/resolve-pages-config.mjs

      # Assert what Pages infers from the directory instead of reading from
      # configuration: SPA fallback (on only while no top-level 404.html exists)
      # and Function scoping (_routes.json, which replaces run_worker_first).
      # Both fail as a plausible 200 rather than as an error, and neither is
      # reproduced by `wrangler pages dev`, so this is the last place to catch
      # them.
      - name: Check the Pages output
        working-directory: apps/web
        run: node scripts/check-pages-output.mjs dist/client

      # --branch is explicit and must equal the project's production branch.
      # Wrangler otherwise infers it from the git workspace, and Actions checks
      # out in detached HEAD — which never matches, so the release would land as
      # a PREVIEW: a permanent, public, unlisted hostname running the same
      # Function, with the same Service binding, onto the same D1 and R2.
      #
      # NOTE on the trust boundary: this step compiles apps/web/pages/functions/
      # with esbuild, inside the job that holds the credentials, which the header
      # of this file says must not happen. There is no supported way to
      # pre-compile a Pages Function without switching to advanced mode, where a
      # _worker.js takes over every request and the routing model changes. The
      # regression is therefore accepted and bounded instead: the Function is a
      # single reviewed file, typechecked by apps/web/pages/tsconfig.json, and
      # resolve-pages-config.mjs refuses to run if it imports anything — so what
      # compiles here can contain nothing but itself.
      - name: Deploy the client to Pages
        working-directory: apps/web/pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CF_DEPLOY_TOKEN_VALUE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
          AAT_PAGES_PROJECT: ${{ steps.doppler.outputs.AAT_PAGES_PROJECT }}
        run: |
          # pipefail, because `| tee` otherwise reports ITS exit status and the
          # step goes green while wrangler has failed. That is exactly what
          # happened on the first attempt: "Command wrangler not found", step
          # success, nothing deployed. Only the assertion below caught it.
          set -euo pipefail
          # By path, not `pnpm exec`. This directory is not a workspace package,
          # so pnpm has no project from which to resolve the binary — and the
          # working directory has to be this one, because `wrangler pages deploy`
          # discovers `functions/` relative to the process CWD.
          node ../node_modules/wrangler/bin/wrangler.js pages deploy \
            --project-name "$AAT_PAGES_PROJECT" \
            --branch main \
            --commit-dirty=true \
            | tee "$RUNNER_TEMP/pages-deploy.log"

      # Three things that are only visible in the deploy log, each of which
      # otherwise produces a working-looking site with a broken API.
      - name: Confirm the deployment carries its Function and routes
        run: |
          log="$RUNNER_TEMP/pages-deploy.log"
          fail=0
          grep -qi 'Functions bundle' "$log" || {
            echo "::error::No Functions bundle was uploaded. /api/* would fall through to the SPA and return index.html with HTTP 200."
            fail=1
          }
          grep -qi '_routes.json' "$log" || {
            echo "::error::_routes.json was not uploaded. Pages would generate its own route table and send static requests to the Function."
            fail=1
          }
          grep -qi 'Deployment complete' "$log" || {
            echo "::error::wrangler did not report a completed deployment."
            fail=1
          }
          exit $fail
