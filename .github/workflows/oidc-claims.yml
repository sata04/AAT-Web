name: OIDC claims

# A throwaway. Run it once, read the table, delete the file.
#
# Doppler's identity is authorised by exact string comparison against the claims
# in the GitHub OIDC token, and a wrong value fails in the worst possible way: it
# saves, it looks right, and it never matches. The `sub` claim is the trap —
# repositories created after 15 July 2026 use an immutable format that includes
# the owner and repository IDs, so every tutorial's
# `repo:OWNER/REPO:environment:NAME` is wrong here.
#
# This prints the claims and nothing else. It mints a token (that is the only way
# to see what the claims actually are), decodes the payload, and never prints the
# token itself or the signature.
on:
  workflow_dispatch:

permissions: {}

jobs:
  claims:
    name: Print the claims this repository presents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The same environment the deploy job declares. Without it the subject would
    # carry the branch instead, which is a different string and would make this
    # whole exercise measure the wrong thing.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      # No action. GitHub injects ACTIONS_ID_TOKEN_REQUEST_URL and
      # ACTIONS_ID_TOKEN_REQUEST_TOKEN into every step of a job that has
      # `id-token: write`, so minting the token is a plain HTTP request — and
      # adding a dependency here would mean resolving a digest that can actually
      # be verified rather than copying a plausible-looking one.
      #
      # The token is fetched, its payload decoded, and only the claims printed.
      # The token and its signature never reach the log or the summary.
      - name: Mint a token and print only its claims
        run: |
          set -euo pipefail
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$(node -p 'encodeURIComponent(process.env.AUDIENCE)')" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value))')
          printf '%s' "$token" | node -e '
            let raw = ""
            process.stdin.on("data", (d) => { raw += d }).on("end", () => {
              const claims = JSON.parse(Buffer.from(raw.split(".")[1], "base64url").toString("utf8"))
              const first = [
                "iss","aud","sub","environment","ref","ref_type","repository","repository_id",
                "repository_owner","repository_owner_id","repository_visibility","workflow",
                "workflow_ref","job_workflow_ref","event_name","runner_environment","actor",
              ]
              const rows = first.filter((n) => claims[n] !== undefined).map((n) => `| \`${n}\` | \`${claims[n]}\` |`)
              const rest = Object.keys(claims)
                .filter((n) => !first.includes(n) && !["iat","exp","nbf","jti"].includes(n))
                .sort()
              const out = [
                "## OIDC claims presented by this job", "",
                "Enter these into the Doppler identity exactly as printed.", "",
                "| claim | value |", "| --- | --- |", ...rows, "",
                "### Other claims present", "",
                rest.length ? rest.map((n) => `- \`${n}\``).join("\n") : "_none_", "",
              ].join("\n")
              require("node:fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, out)
              console.log("Claims written to the job summary. The token itself was not printed.")
            })'
        env:
          # The action this repository deploys with requests no explicit audience,
          # so the default applies. Asking for the same thing here is the point:
          # a claim table taken with a different audience would not be the one
          # Doppler will see.
          AUDIENCE: https://github.com/${{ github.repository_owner }}
