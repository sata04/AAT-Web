[pytest]
testpaths = tests
# `-p no:cacheprovider`: the suite also runs in read-only checkouts (CI workspace copies),
# where pytest's cache is a local convenience (`--lf`, `--ff`) and its "could not create cache
# path" warning would otherwise be promoted to an error by `filterwarnings` below.
addopts = -ra --strict-markers -p no:cacheprovider
# The renderer is a visual contract: a DeprecationWarning from Matplotlib, NumPy or Pillow is an
# early warning that a future version will draw something different, so it fails the build now
# rather than surprising a researcher later.
filterwarnings =
    error
