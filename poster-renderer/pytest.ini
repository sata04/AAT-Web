[pytest]
testpaths = tests
# `-p no:cacheprovider`: the suite also runs inside the container image, where /app belongs to
# root and the process is the unprivileged `poster` user. pytest's cache is a local convenience
# (`--lf`, `--ff`) and its "could not create cache path" warning would otherwise be promoted to an
# error by `filterwarnings` below. Making /app writable to buy back `--lf` would be a poor trade.
addopts = -ra --strict-markers -p no:cacheprovider
# The renderer is a visual contract: a DeprecationWarning from Matplotlib, NumPy or Pillow is an
# early warning that a future version will draw something different, so it fails the build now
# rather than surprising a researcher later.
filterwarnings =
    error
