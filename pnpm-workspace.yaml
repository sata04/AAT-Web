packages:
  - "apps/*"
  - "packages/*"

# --- Supply-chain policy (see docs/supply-chain.md) -------------------------

# Refuse any version published less than 7 days (10080 minutes) ago. Most
# compromised packages are detected and unpublished within days, so skipping
# that window removes the bulk of the risk at no ongoing cost.
# To take an emergency security fix sooner, add "name@version" to
# minimumReleaseAgeExclude, land it, then remove the entry again.
minimumReleaseAge: 10080

# Refuse transitive dependencies fetched from anywhere other than the npm
# registry (git+https, arbitrary tarball URLs). Every AAT dependency is an
# ordinary npm package, so anything caught here is itself the signal.
blockExoticSubdeps: true

# Reject versions whose publish provenance got weaker than the preceding
# release (a common account-takeover signature). Orthogonal to release age:
# it catches takeovers that seven days of waiting would not surface.
trustPolicy: no-downgrade
trustPolicyExclude:
  # Reached through workbox-build (vite-plugin-pwa). The same publisher shipped
  # 2.5.0 with provenance and then this prerelease without it 32 minutes later
  # (2025-12-02); the later 4.0.0-pre2 is published by a trusted publisher
  # again. Audited as a packaging slip, not a takeover — same conclusion the
  # examtrace repository reached independently for this exact version.
  - "@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1"
  # Backport of the ReDoS fix CVE-2022-25883 onto the v6 line (published
  # 2023-07-10). Contemporary v7 releases carried provenance, so publish-date
  # ordering flags this as a downgrade, but it is a legitimate npm/node release.
  # Reached through @babel/core under workbox-build.
  - semver@6.3.1

# Install/build scripts run only for the packages listed true here. Everything
# else is blocked, so a compromised transitive dependency cannot execute code
# at install time. Keep this list as short as it can possibly be.
allowBuilds:
  "@biomejs/biome": true
  esbuild: true
  workerd: true

# Emergency security updates (see docs/supply-chain.md, "Emergency security
# updates"): force a transitive dependency past a maintainer's own pin/range
# because the pinned version has a known advisory. Each entry names the
# advisory and is removed once the upstream package (postcss, miniflare)
# picks up the fix itself.
#
# Retired on 2026-09-20, both because upstream caught up:
#
#   nanoid@<3.3.18 (GHSA-2v37-7h3g-55p8) — postcss now resolves nanoid 3.3.19
#     on its own, so the selector matched nothing. It was not harmless to keep:
#     Renovate kept proposing it be re-targeted at nanoid 6, which has no CJS
#     export for postcss's require() and would have broken the build the first
#     time anything did fall under 3.3.18.
#   undici@<7.29.0 (GHSA-4cwx-7wf7-3272 and four related) — miniflare pins
#     undici 7.29.0 itself now, so the override forced nothing, and the same
#     re-targeting pressure pointed at undici 8, a breaking major.
#
# Checked by removing each selector and re-resolving: the lockfile does not
# move. osv-scanner runs on every dependency change and daily, so a future
# regression below a fixed version surfaces there rather than in a pin nobody
# re-reads.
overrides:
  # GHSA-rgj7-g3m4-5g8c (high): libheif vulnerabilities shipped in sharp's
  # prebuilt binaries, exploitable when decoding untrusted AVIF/HEIF input.
  # Reached through miniflare (wrangler / @cloudflare/vite-plugin /
  # @cloudflare/vitest-pool-workers dev tooling); sharp is not in the deployed
  # Worker bundle. 0.35.4 vendors libheif 1.23.2 with the fixes; 0.35.5 adds the
  # fix for GHSA-wq5f-xc86-pv6w (high).
  sharp@<0.35.5: "0.35.5"
  # Advisories open on 2026-10-12 (osv-scanner "Known vulnerabilities"), all in
  # dev/build tooling — none of these packages is in the deployed bundle. Each
  # selector stays inside the major the parent already resolves, so the override
  # can never pull a breaking major in.
  # undici 7.29.0 is pinned exactly by miniflare (GHSA-2gqq-gqf2-x968,
  # GHSA-2jfj-6hjv-fm6j, GHSA-3wwx-pv8p-q78v, GHSA-3xpg-4rpp-hhhm,
  # GHSA-8436-99hf-9mmv, GHSA-pmjh-fq2x-6v4x, GHSA-r53p-7pc4-xj5r,
  # GHSA-rfgv-xxqx-mfg5, GHSA-rx4f-c7p8-82vq, GHSA-w293-vg96-wgc3).
  undici@>=7.0.0 <7.29.1: "7.29.1"
  # GHSA-6j4f-fj2g-mc7p, GHSA-q2hr-2g5m-vwhr, GHSA-qhr7-859c-m2p7 (via minimatch).
  brace-expansion@>=2.0.0 <2.1.7: "2.1.7"
  brace-expansion@>=5.0.0 <5.0.12: "5.0.12"
  # GHSA-hrr3-gc8f-f4qj (via ajv).
  fast-uri@>=3.0.0 <3.1.8: "3.1.8"
  # GHSA-gfhx-hw2g-v5hg (via @rollup/plugin-terser).
  serialize-javascript@>=7.0.0 <7.1.2: "7.1.2"
  # GHSA-68fv-2mgg-jv7q (via postcss / css-tree).
  source-map-js@>=1.0.0 <1.2.2: "1.2.2"
